<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply Now | HowTo Jobs</title><meta name="description" content="Submit an application using the multi-step form."><link rel="stylesheet" href="/assets/styles.css"></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="/">HowTo Jobs</a><nav><a href="/">Jobs</a><a href="/contact.html">Contact</a></nav></div></header><main class="article"><div class="wrap"><section class="panel"><h1>Application Form</h1><p id="job-name" class="meta"></p><div class="steps"><span class="step active">1 Personal</span><span class="step">2 Profile</span><span class="step">3 Resume</span><span class="step">4 Review</span><span class="step">5 Submit</span></div><form id="application-form"><div class="form-step active"><div class="form-grid"><label class="field"><span>Full name</span><input required name="full_name"></label><label class="field"><span>Email</span><input required type="email" name="email"></label><label class="field"><span>Phone</span><input name="phone"></label><label class="field"><span>City</span><input name="city"></label><label class="field full"><span>State / Region</span><input name="state"></label></div><div class="actions"><span></span><button class="btn next" type="button">Next</button></div></div><div class="form-step"><div class="form-grid"><label class="field"><span>Highest education</span><input name="education"></label><label class="field"><span>Experience</span><input name="experience"></label><label class="field full"><span>Skills</span><textarea name="skills" rows="4"></textarea></label><label class="field full"><span>Availability</span><select name="availability"><option>Immediately</option><option>Within 2 weeks</option><option>Within 1 month</option></select></label></div><div class="actions"><button class="btn secondary prev" type="button">Back</button><button class="btn next" type="button">Next</button></div></div><div class="form-step"><div class="form-grid"><label class="field full"><span>Resume URL</span><input name="resume_url" placeholder="https://..."></label><label class="field full"><span>Additional information</span><textarea name="answers" rows="5"></textarea></label></div><p class="small">For security, this starter collects a resume URL rather than direct file uploads.</p><div class="actions"><button class="btn secondary prev" type="button">Back</button><button class="btn next" type="button">Review</button></div></div><div class="form-step"><div id="review"></div><div class="actions"><button class="btn secondary prev" type="button">Back</button><button class="btn next" type="button">Continue</button></div></div><div class="form-step"><p>Click submit only after checking the information.</p><label class="field"><span><input required type="checkbox" name="consent"> I confirm the information is accurate and agree to the site's privacy policy and terms.</span></label><div class="actions"><button class="btn secondary prev" type="button">Back</button><button class="btn" type="submit">Submit Application</button></div><p id="result" class="small"></p></div></form></section></div></main><script src="/assets/jobs.js"></script><script src="/assets/apply.js"></script></body></html>
